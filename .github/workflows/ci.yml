name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Ahr.Foundation.slnx --locked-mode
      - run: dotnet format Ahr.Foundation.slnx --verify-no-changes --no-restore
        if: matrix.os == 'ubuntu-latest'
      - run: dotnet build Ahr.Foundation.slnx -c Release --no-restore
      - name: Run Tests and Generate TRX Reports
        run: dotnet test --solution Ahr.Foundation.slnx -c Release --no-build --report-trx --results-directory artifacts/test-results
        env:
          ASSURANCE_RUN_ID: ci-${{ github.run_id }}
      - name: Run Tests Against the netstandard2.0 Build
        run: dotnet test --project tests/Ahr.Foundation.Tests/Ahr.Foundation.Tests.csproj -c Release -p:AhrFoundationTestTarget=netstandard2.0 --report-trx --results-directory artifacts/test-results
        env:
          ASSURANCE_RUN_ID: ci-${{ github.run_id }}-netstandard2.0
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: .NET Test Results (${{ matrix.os }})
          path: artifacts/test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: true
      - name: Build the Assurance report
        if: always()
        shell: bash
        env:
          ASSURANCE_CLI_VERSION: 0.1.0
        run: |
          version="$(dotnet msbuild src/Ahr.Foundation/Ahr.Foundation.csproj -getProperty:AhrFoundationVersion)"
          dotnet tool execute "Ahr.Assurance.Cli@$ASSURANCE_CLI_VERSION" report Ahr.Foundation.slnx \
            --run ci-${{ github.run_id }} --title "AHR Foundation $version" < /dev/null
      - name: Upload the Assurance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assurance-report-${{ matrix.os }}
          path: artifacts/assurance/report/
          if-no-files-found: warn
      - name: Write the report headline to the job summary
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          report=artifacts/assurance/report/report.html
          [ -f "$report" ] || exit 0
          headline="$(grep -o '<p class="headline">[^<]*' "$report" | head -1 | sed 's/.*>//' || true)"
          tests="$(grep -o '[0-9]* tests\? ran: [^<]*' "$report" | head -1 || true)"
          title="$(grep -o '<h1>[^<]*' "$report" | head -1 | sed 's/.*>//' || true)"
          {
            printf '### Assurance report: %s at %s\n\n%s\n\n' "$title" "${GITHUB_SHA::7}" "$headline"
            if [ -n "$tests" ]; then printf '%s\n\n' "$tests"; fi
            printf 'Download the `assurance-report-%s` artifact for the full report.\n' "${{ matrix.os }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ahr-foundation-test-results-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: error
      - run: dotnet pack src/Ahr.Foundation/Ahr.Foundation.csproj -c Release --no-build -o artifacts/packages
        if: matrix.os == 'ubuntu-latest'
      - name: Verify packaged sample consumer
        if: matrix.os == 'ubuntu-latest'
        run: scripts/verify-package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/packages/*
          if-no-files-found: error

  docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet tool update -g docfx
      - run: dotnet restore Ahr.Foundation.slnx --locked-mode
      - name: Generate API metadata
        run: docfx metadata
      - name: Order API navigation
        run: python3 scripts/order-api-toc.py
      - name: Verify documentation builds
        run: docfx build --warningsAsErrors
